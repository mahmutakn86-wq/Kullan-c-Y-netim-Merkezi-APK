name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor for Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Configuration
        run: |
          npx cap init "AKINCI Cloud" "com.akinci.cloud.admin" --web-dir "dist" || true
          npx cap add android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK to GitHub Artifacts (Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: AKINCI-Cloud-Admin-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
